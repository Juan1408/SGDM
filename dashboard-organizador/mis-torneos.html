<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ascend | Mis torneos</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/mis-torneos.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <div class="dashboard">

        <header class="navbar">

            <div class="navbar__logo">
                ASCEND
            </div>

            <div class="navbar__user">

                <button
                    class="navbar__notification"
                    type="button"
                    aria-label="Ver notificaciones"
                >
                    <i class="fa-solid fa-bell"></i>
                </button>

                <div class="user">
                    <img
                        src="https://placehold.co/40x40"
                        alt="Foto de perfil de Mauricio"
                    >

                    <span>Mauricio</span>
                </div>

            </div>

        </header>

        <aside class="sidebar">

            <div class="sidebar__profile">

                <img
                    src="https://placehold.co/90x90"
                    alt="Foto de perfil de Mauricio"
                >

                <h2>Mauricio</h2>
                <span>Organizador</span>

            </div>

            <nav aria-label="Navegación del organizador">

                <a href="inicio.html">
                    <i class="fa-solid fa-house"></i>
                    <span>Inicio</span>
                </a>

                <a
                    class="active"
                    href="mis-torneos.html"
                    aria-current="page"
                >
                    <i class="fa-solid fa-trophy"></i>
                    <span>Mis torneos</span>
                </a>

                <a href="crear-torneo.html">
                    <i class="fa-solid fa-plus"></i>
                    <span>Crear torneo</span>
                </a>

                <a href="perfil.html">
                    <i class="fa-solid fa-user"></i>
                    <span>Mi perfil</span>
                </a>

            </nav>

            <div class="sidebar__bottom">

                <a href="#">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Cerrar sesión</span>
                </a>

            </div>

        </aside>

        <main class="content">

            <header class="content__header">

                <h1>Mis torneos</h1>

                <p class="subtitle">
                    Selecciona un torneo para consultar sus datos y acceder
                    a las opciones de administración.
                </p>

            </header>

            <section class="torneos-page">

                <div class="torneos-page__listado">

                    <div class="section-header">
                        <h2>Torneos creados</h2>

                        <a href="crear-torneo.html">
                            Crear torneo
                        </a>
                    </div>

                    <div
                        class="torneos-lista"
                        id="torneosLista"
                    ></div>

                </div>

                <article
                    class="torneo-seleccionado"
                    id="torneoSeleccionado"
                ></article>

            </section>

        </main>

    </div>

    <script src="js/utils.js"></script>
    <script src="js/misTorneos.js"></script>

</body>

</html>
