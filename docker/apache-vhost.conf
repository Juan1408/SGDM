# Configuración de Apache para SGDM / ASCEND
# El docroot apunta SOLO a la carpeta pública. El resto del código
# (configuración, modelos, vistas, tests) queda fuera del alcance web.
<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    ServerName localhost
    DocumentRoot /var/www/html/publico

    <Directory /var/www/html/publico>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
