<!DOCTYPE html>
<html lang="es">

<head>

   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <title>ASCEND - Crear Cuenta</title>

   <!-- CSS -->
   <link rel="stylesheet" href="../../publico/css/variables.css">
  <link rel="stylesheet" href="../../publico/css/publico/login.css">

   <!-- Font Awesome -->
   <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
   />

   <!-- Google Fonts -->
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

  <main class="login-contenedor">

  <!-- PANEL DEL FORMULARIO -->
  <div class="login-panel">

    <!-- REGISTRO -->
    <div class="formulario-contenido active" id="formulario-registro">
      
      <a href="../publico/index.html" class="btn-volver-inicio"><i class="fa-solid fa-arrow-left"></i> Volver al Inicio</a>
      <div class="formulario-logo">
        <a href="../publico/index.html">
          <img src="../../publico/img/logos/ascend-png.png" alt="Logo de ASCEND">
        </a>
      </div>
      <h1>Crear Cuenta</h1>
      <form>
        <div class="input-group">
          <input type="text" id="registro-nombre" required>
          <label for="registro-nombre">Nombre completo</label>
        </div>
        <div class="input-group">
          <input type="text" id="registro-usuario" required>
          <label for="registro-usuario">Usuario</label>
        </div>
        <fieldset class="role-toggle">
          <legend>Rol</legend>
          <div class="role-options">
            <input type="radio" name="rol" id="rol-jugador" value="jugador" checked>
            <label for="rol-jugador"><i class="fa-solid fa-user"></i> Jugador</label>
            <input type="radio" name="rol" id="rol-organizador" value="organizador">
            <label for="rol-organizador"><i class="fa-solid fa-user-shield"></i> Organizador</label>
          </div>
        </fieldset>
        <div class="input-group">
          <input type="email" id="registro-email" required>
          <label for="registro-email">Correo electrónico</label>
        </div>
        <div class="input-group password-group">
          <input type="password" id="registro-password" required>
          <label for="registro-password">Contraseña</label>
          <button type="button" class="btn-mostrar-contrasena" aria-label="Mostrar contraseña">
            <i class="fa-regular fa-eye-slash"></i>
          </button>
        </div>
        <div class="input-group password-group">
          <input type="password" id="registro-password-confirmar" required>
          <label for="registro-password-confirmar">Confirmar contraseña</label>
          <button type="button" class="btn-mostrar-contrasena" aria-label="Mostrar contraseña">
            <i class="fa-regular fa-eye-slash"></i>
          </button>
        </div>
        <button type="button" class="auth-btn">Registrarse</button>
      </form>
      <p class="switch-text">¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a></p>
    </div>

  </div>
</main>


</body>

</html>
