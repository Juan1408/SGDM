<!DOCTYPE html>
<html lang="es">

<head>

   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <title>ASCEND - Recuperar Contraseña</title>

   <!-- CSS -->
  <link rel="stylesheet" href="../../publico/css/variables.css">
  <link rel="stylesheet" href="../../publico/css/publico/login.css">

   <style>
     .oculto { display: none !important; }
   </style>

   <!-- Font Awesome -->
   <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
   />

   <!-- Google Fonts -->
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

  <main class="login-contenedor">

  <!-- PANEL DEL FORMULARIO -->
  <div class="login-panel">

    <!-- RECUPERAR CONTRASEÑA -->
    <div class="formulario-contenido active" id="recovery-form">
      
      <a href="../publico/index.html" class="btn-volver-inicio"><i class="fa-solid fa-arrow-left"></i> Volver al Inicio</a>
      <div class="formulario-logo">
        <a href="../publico/index.html">
          <img src="../../publico/img/logos/ascend-png.png" alt="Logo de ASCEND">
        </a>
      </div>
      <h1>Recuperar Contraseña</h1>
      <div id="recuperacion-paso-1">
        <p class="recovery-text">Ingresá tu correo electrónico.</p>
        <div class="input-group">
          <input type="email" id="recuperar-email" required>
          <label for="recuperar-email">Correo electrónico</label>
        </div>
        <button type="button" class="auth-btn" onclick="showRecoveryCode()">Enviar código</button>
      </div>
      <div id="recuperacion-paso-2" class="oculto">
        <p class="recovery-text">Ingresá el código recibido.</p>
        <fieldset class="code-box">
          <legend class="sr-only">Código de verificación de 4 dígitos</legend>
          <input maxlength="1" aria-label="Dígito 1 de 4">
          <input maxlength="1" aria-label="Dígito 2 de 4">
          <input maxlength="1" aria-label="Dígito 3 de 4">
          <input maxlength="1" aria-label="Dígito 4 de 4">
        </fieldset>
        <button type="button" class="auth-btn" onclick="showRecoveryPassword()">Verificar</button>
      </div>
      <div id="recuperacion-paso-3" class="oculto">
        <p class="recovery-text">Elegí una nueva contraseña.</p>
        <div class="input-group">
          <input type="password" id="recuperar-nueva-password" required>
          <label for="recuperar-nueva-password">Nueva contraseña</label>
        </div>
        <div class="input-group">
          <input type="password" id="recuperar-confirmar-password" required>
          <label for="recuperar-confirmar-password">Confirmar contraseña</label>
        </div>
        <button type="button" class="auth-btn" onclick="window.location.href='login.html'">Guardar contraseña</button>
      </div>
      <p class="switch-text"><a href="login.html">Volver al login</a></p>
    </div>

  </div>
</main>

   <script>
      function showRecoveryCode() {
         document.getElementById('recuperacion-paso-1').classList.add('oculto');
         document.getElementById('recuperacion-paso-2').classList.remove('oculto');
         document.getElementById('recuperacion-paso-3').classList.add('oculto');
      }

      function showRecoveryPassword() {
         document.getElementById('recuperacion-paso-1').classList.add('oculto');
         document.getElementById('recuperacion-paso-2').classList.add('oculto');
         document.getElementById('recuperacion-paso-3').classList.remove('oculto');
      }
   </script>

</body>

</html>
