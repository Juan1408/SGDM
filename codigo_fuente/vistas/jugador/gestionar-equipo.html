<!DOCTYPE html>
<html lang="es">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>ASCEND - Gestionar Equipo</title>

   <link rel="stylesheet" href="../../publico/css/variables.css">
   <link rel="stylesheet" href="../../publico/css/base.css">
   <link rel="stylesheet" href="../../publico/css/layouts/navbar.css">
   <link rel="stylesheet" href="../../publico/css/layouts/footer.css">
   <link rel="stylesheet" href="../../publico/css/jugador/crear-equipo.css">
   <link rel="stylesheet" href="../../publico/css/jugador/gestionar-equipo.css">

   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

   <!-- NAVBAR ---------------------------->
   <div id="navbar-publico-placeholder"></div>

   <main class="crear-equipo-pagina">

      <div class="crear-equipo-header">
         <span class="gestion-etiqueta" id="gestion-rol-etiqueta">Líder del equipo</span>
         <h1 id="gestion-nombre-equipo">Gestionar Equipo</h1>
         <p>Editá los datos de tu equipo, sumá jugadores nuevos y asigná un capitán.</p>
      </div>

      <div class="crear-equipo-formulario">

         <!-- ============================== -->
         <!-- EDITAR DATOS DEL EQUIPO        -->
         <!-- (mismos campos que crear-equipo) -->
         <!-- ============================== -->
         <form class="tarjeta-equipo" id="formulario-editar-equipo">
            <h2>Datos del equipo</h2>

            <div class="crear-equipo-imagenes">
               <div class="campo-imagen campo-banner">
                  <div class="preview-banner" id="preview-banner">
                     <img id="preview-banner-img" src="" alt="" hidden>
                     <span class="placeholder-texto">Sin banner todavía</span>
                  </div>
                  <label for="input-banner" class="boton-subir-imagen">
                     <i class="fa-solid fa-image"></i> Cambiar banner
                  </label>
                  <input type="file" id="input-banner" accept="image/*" hidden>
               </div>

               <div class="campo-imagen campo-escudo">
                  <div class="preview-escudo" id="preview-escudo">
                     <img id="preview-escudo-img" src="" alt="" hidden>
                     <i class="fa-solid fa-shield-halved placeholder-icono"></i>
                  </div>
                  <label for="input-escudo" class="boton-subir-imagen">
                     <i class="fa-solid fa-camera"></i> Cambiar escudo
                  </label>
                  <input type="file" id="input-escudo" accept="image/*" hidden>
               </div>
            </div>

            <div class="campo-grupo">
               <label for="nombre_equipo">Nombre del equipo</label>
               <input type="text" id="nombre_equipo" name="nombre_equipo" required maxlength="100">
            </div>

            <div class="campo-fila">
               <div class="campo-grupo">
                  <label for="juego_id">Juego / Disciplina</label>
                  <select id="juego_id" name="juego_id" required>
                     <option value="1">Valorant</option>
                     <option value="2">League of Legends</option>
                     <option value="3">Ajedrez</option>
                     <option value="4">Fútbol 5</option>
                     <option value="5">Truco</option>
                  </select>
               </div>

               <div class="campo-grupo">
                  <label for="localidad">Localidad</label>
                  <input type="text" id="localidad" name="localidad" maxlength="100">
               </div>
            </div>

            <div class="campo-grupo">
               <label for="descripcion">Descripción</label>
               <textarea id="descripcion" name="descripcion" rows="4"></textarea>
            </div>

            <div class="campo-grupo">
               <label>Código de invitación</label>
               <div class="codigo-invitacion-box">
                  <span id="codigo-invitacion-texto">----</span>
                  <button type="button" id="btn-copiar-codigo"><i class="fa-solid fa-copy"></i> Copiar</button>
               </div>
            </div>

            <div class="crear-equipo-acciones">
               <button type="submit" class="boton-registro">Guardar Cambios</button>
            </div>
         </form>

         <!-- ============================== -->
         <!-- MIEMBROS DEL EQUIPO            -->
         <!-- ============================== -->
         <section class="tarjeta-equipo">
            <h2>Miembros del equipo</h2>

            <div class="lista-jugadores" id="lista-miembros">
               <!-- Se llena por JS -->
            </div>
         </section>

         <!-- ============================== -->
         <!-- AGREGAR JUGADORES              -->
         <!-- ============================== -->
         <section class="tarjeta-equipo">
            <h2>Agregar jugadores</h2>

            <div class="buscador-jugadores">
               <i class="fa-solid fa-magnifying-glass"></i>
               <input type="text" id="input-buscar-jugador" placeholder="Buscar por nombre o usuario...">
            </div>

            <div class="lista-jugadores" id="lista-resultados-busqueda">
               <p class="lista-vacia" id="mensaje-busqueda-vacia">Escribí un nombre o usuario para buscar jugadores.</p>
            </div>
         </section>

         <!-- ============================== -->
         <!-- SOLICITUDES PENDIENTES         -->
         <!-- ============================== -->
         <section class="tarjeta-equipo">
            <h2>Solicitudes pendientes</h2>

            <div class="lista-jugadores" id="lista-solicitudes">
               <p class="lista-vacia" id="mensaje-solicitudes-vacia">No hay solicitudes pendientes.</p>
            </div>
         </section>

      </div>

   </main>

   <!-- FOOTER ---------------------------->
   <div id="footer-publico-placeholder"></div>

   <script src="../../publico/js/includesPublicos.js"></script>
   <script src="../../publico/js/navbar.js"></script>
   <script src="../../publico/js/gestionar-equipo.js"></script>

</body>
</html>
