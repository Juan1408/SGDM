<section class="modulo-admin">
    <h2 class="titulo-pantalla">Registrar Nuevo Equipo</h2>
    <form action="/admin/equipos/guardar" method="POST" class="formulario-estandar validacion-activa">
        <fieldset>
            <legend>Información Principal del Equipo</legend>
            <label for="nombre_equipo">Nombre del Equipo:</label>
            <input type="text" id="nombre_equipo" name="nombre_equipo" class="campo-requerido" required>
            
            <label for="capitan">Capitán del Equipo:</label>
            <select id="capitan" name="capitan" class="campo-requerido">
                <option value="4">Juan Fernández (juan@ejemplo.com)</option>
                <option value="5">Miguel Barneto (miguel@ejemplo.com)</option>
            </select>
        </fieldset>
        
        <div class="grupo-botones">
            <button type="submit" class="boton-accion">Guardar Equipo</button>
            <a href="#equipos/lista" class="boton-secundario">Cancelar</a>
        </div>
    </form>
</section>
