<div>
    <h2 class="titulo-pantalla">Crear Nuevo Torneo</h2>
    <form action="/admin/torneos/guardar" method="POST" class="formulario-estandar validacion-activa">
        <fieldset>
            <legend>Información General</legend>
            <label for="nombre">Nombre del Torneo:</label>
            <input type="text" id="nombre" name="nombre" class="campo-requerido" required>
            
            <label for="descripcion">Descripción:</label>
            <textarea id="descripcion" name="descripcion" rows="4"></textarea>
        </fieldset>
        
        <fieldset>
            <legend>Configuración de Formato</legend>
            <label for="tipo_modalidad">Modalidad:</label>
            <select id="tipo_modalidad" name="tipo_modalidad" class="campo-requerido">
                <option value="Individual">Individual</option>
                <option value="Equipos">Equipos</option>
            </select>
            
            <label for="formato_competicion">Formato de Competición:</label>
            <select id="formato_competicion" name="formato_competicion" class="campo-requerido">
                <option value="Liga">Liga (Todos contra Todos)</option>
                <option value="Eliminacion">Eliminación Directa</option>
                <option value="Suizo">Sistema Suizo</option>
            </select>
        </fieldset>

        <div class="grupo-botones">
            <button type="submit" class="boton-accion">Crear Torneo</button>
            <a href="index.php?vista=torneos/lista" class="boton-secundario">Cancelar</a>
        </div>
    </form>
</div>
