<div>
    <h2>Formulario de Usuario</h2>
    
    <nav>
        <a href="lista.html">Volver al Listado</a>
    </nav>
    
    <section>
        <form action="/usuarios/guardar" method="POST">
            <fieldset>
                <legend>Datos Personales</legend>
                
                <label for="nombre">Nombre Completo:</label>
                <input type="text" name="nombre" value="" required>
                
                <label for="correo">Correo Electrónico:</label>
                <input type="email" name="correo" value="" required>
                
                <label for="contrasena">Contraseña:</label>
                <input type="password" name="contrasena" value="">
                <small>Dejar en blanco para no modificar si está editando.</small>
            </fieldset>
            
            <fieldset>
                <legend>Configuración de Cuenta</legend>
                
                <label for="rol">Rol en el Sistema:</label>
                <select name="rol" required>
                    <option value="">Seleccione un rol...</option>
                    <option value="administrador">Administrador General</option>
                    <option value="organizador">Organizador de Torneo</option>
                    <option value="participante">Participante</option>
                </select>
                
                <label for="estado">Estado de la Cuenta:</label>
                <select name="estado" required>
                    <option value="activo">Activo</option>
                    <option value="inactivo">Inactivo</option>
                </select>
            </fieldset>
            
            <button type="submit">Guardar Usuario</button>
            <button type="reset">Limpiar Formulario</button>
        </form>
    </section>
</div>
