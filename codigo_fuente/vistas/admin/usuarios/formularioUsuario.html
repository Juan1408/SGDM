<!--=
    VISTA: FORMULARIO CREAR/EDITAR USUARIO
    UBICACION DEL ARCHIVO EN vistas/admin/usuarios/formulario.html-->

<div class="formulario-wrapper">
    <div class="cabecera-header">
        <h1 class="titulo-formulario" id="formularioTituloUsuario">Crear/Editar Usuario</h1>
        <a href="index.html" class="boton boton-secundario">Volver</a>
    </div>
    
    <form id="formularioUsuario" class="formulario-usuario">

        <!-- CAMPO DE NOMBRE -->
        <div class="campo-formulario">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Juan" required>
        </div>

        <!-- CAMPO DE APELLIDO -->
        <div class="campo-formulario">
            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" name="apellido" placeholder="Perez" required>
        </div>

        <!-- CAMPO DE CORREO ELECTRÓNICO -->
        <div class="campo-formulario">
            <label for="emailUsuario">Correo Electrónico:</label>
            <input type="email" id="emailUsuario" name="email" placeholder="juan@ejemplo.com" required>
        </div>

        <!-- CAMPO DE CONTRASEÑA-->
        <div class="campo-formulario">
            <label for="contrasena">Contraseña:</label>
            <input type="password" id="contrasenaUsuario" name="contrasena" class="control-formulario" placeholder="********" required>
        </div>

        <!-- CAMPO DE CONFIRMAR CONTRASEÑA-->
        <div class="campo-formulario">
            <label for="confirmarContrasena">Confirmar Contraseña:</label>
            <input type="password" id="confirmarContrasenaUsuario" name="confirmarContrasena" class="control-formulario" placeholder="********" required>
        </div>
        <!-- SECCION DE ROLES-->
        <div class="campo-formulario">
            <label for="rolUsuario">Rol:</label>
            <select id="rolUsuario" name="rol" required>
                <option value="">Seleccione un rol</option>
                <option value="admin">Administrador</option>
                <option value="organizador">Organizador</option>
                <option value="jugador">Jugador</option>
            </select>
        </div>

        <!-- SECCION DE ESTADO DEL USUARIO-->
        <div class="campo-formulario">
            <label for="estado">Estado:</label>
            <select id="estado" name="estado" required>
                <option value="">Seleccione un estado</option>
                <option value="activo">Activo</option>
                <option value="inactivo">Inactivo</option>
            </select>
        </div>

        <!-- CAMPOS OPCIONALES DE TELEFONO-->
        <div class="campo-formulario">
            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefonoUsuario" name="telefono" class="control-formulario" placeholder="091 234 567">
        </div>

        <!-- BOTON DE ENVIO DEL FORMULARIO-->
        <div class="campo-formulario">
            <button type="submit" class="boton-primario" id="botonGuardarUsuario">Guardar Usuario</button>
        </div>
    </form>
</div>
